egory="antiblues" data-cols="3" data-rows="1"><a href="/farber-site/antiblues/field-note-001/" aria-label="Antiblues — Field Note 001"><img src="/farber-site/_astro/cover.DcItsp3W_kkUKa.webp" srcset="/farber-site/_astro/cover.DcItsp3W_1uDfu5.webp 360w, /farber-site/_astro/cover.DcItsp3W_2tozyc.webp 720w, /farber-site/_astro/cover.DcItsp3W_1TOIAe.webp 1080w, /farber-site/_astro/cover.DcItsp3W_kkUKa.webp 1200w" alt sizes="(max-width: 479px) 100vw, (max-width: 767px) 50vw, 50vw" loading="lazy" decoding="async" width="1200" height="1200"><span>Antiblues — Field Note 001</span></a></article></main><script>(function(){const filterSlugs = ["projects","digest","notes","photos","antiblues"];

    const validFilters = new Set(["show-all", ...filterSlugs]);
    const links = [...document.querySelectorAll("[data-filter-link]")];
    const cards = [...document.querySelectorAll("[data-filterable]")];

    function readFilter() {
      const value = new URLSearchParams(window.location.search).get("filter");
      return value && validFilters.has(value) ? value : "show-all";
    }

    function applyFilter(filter) {
      cards.forEach((card) => {
        card.hidden = filter !== "show-all" && card.dataset.category !== filter;
      });

      links.forEach((link) => {
        if (link.dataset.filterLink === filter) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

    links.forEach((link) => {
      link.addEventListener("click", (event) => {
        if (
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        event.preventDefault();
        const filter = link.dataset.filterLink;
        const url = new URL(window.location.href);

        if (filter === "show-all") {
          url.searchParams.delete("filter");
        } else {
          url.searchParams.set("filter", filter);
        }

        window.history.pushState({ filter }, "", url);
        applyFilter(filter);
      });
    });

    window.addEventListener("popstate", () => applyFilter(readFilter()));
    applyFilter(readFilter());
  })();</script></body></html>
